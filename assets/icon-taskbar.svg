
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Tile -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2230" />
      <stop offset="100%" stop-color="#0D121B" />
    </linearGradient>

    <!-- Warm Light Brown / Saddle Tan Leather Hardcover -->
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCA368" />
      <stop offset="40%" stop-color="#C5874B" />
      <stop offset="100%" stop-color="#9E612B" />
    </linearGradient>

    <!-- Rounded Spine Binding (Left edge) -->
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B3A13" />
      <stop offset="50%" stop-color="#9C602A" />
      <stop offset="100%" stop-color="#5E320F" />
    </linearGradient>

    <!-- Unified Solid Page Block Gradient (Fore-Edge & Bottom) -->
    <linearGradient id="solidPageRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2EADB" />
      <stop offset="60%" stop-color="#FAF5EC" />
      <stop offset="100%" stop-color="#E2D4BB" />
    </linearGradient>

    <linearGradient id="solidPageBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DCD0B8" />
      <stop offset="100%" stop-color="#B8A789" />
    </linearGradient>

    <!-- Orange Bookmark Ribbon: Front Glow -->
    <linearGradient id="ribbonFront" x1="0%" y1="0%" x2="100%" y2="40%">
      <stop offset="0%" stop-color="#FFB347" />
      <stop offset="30%" stop-color="#FF881A" />
      <stop offset="75%" stop-color="#D95700" />
      <stop offset="100%" stop-color="#B84000" />
    </linearGradient>

    <!-- Orange Bookmark Ribbon: Underside / Fold Shadow -->
    <linearGradient id="ribbonUnderside" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B03E00" />
      <stop offset="100%" stop-color="#662000" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="ribbonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-color="#3D1800" flood-opacity="0.45" />
    </filter>

    <filter id="textShadow">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#381300" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- 1. Background Squircle Tile -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="2" filter="url(#tileShadow)" />
  <rect x="29" y="29" width="454" height="454" rx="103" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" />

  <!-- 2. Master Book Assembly (Single Solid 3D Book, Tilted -5 deg) -->
  <g transform="translate(256, 256) rotate(-5) translate(-256, -256)" filter="url(#bookShadow)">
    
    <!-- Cast Floor Shadow -->
    <ellipse cx="260" cy="422" rx="160" ry="24" fill="#000000" opacity="0.42" filter="blur(11px)" />

    <!-- A. TOP-LEFT BOOKMARK (Trailing behind book from top spine to bottom right) -->
    <path d="M 126 88 L 156 88 L 368 350 L 340 350 Z" fill="url(#ribbonUnderside)" opacity="0.75" />

    <!-- Top Ribbon Loop: Sewn into the top-left spine binding -->
    <g>
      <path d="M 122 92 
               C 122 62, 130 52, 142 52 
               C 154 52, 160 62, 160 92 
               L 150 92 
               C 150 68, 146 62, 142 62 
               C 136 62, 132 68, 132 92 Z" 
            fill="url(#ribbonFront)" />
      <path d="M 132 92 
               C 132 68, 136 62, 142 62 
               C 146 62, 150 68, 150 92 Z" 
            fill="url(#ribbonUnderside)" opacity="0.6" />
    </g>

    <!-- B. BACK COVER (Extruded by dx:16, dy:16 from front cover) -->
    <!-- Front cover is at (130, 85, 235, 295), so Back cover is at (146, 101, 235, 295) -->
    <rect x="146" y="101" width="235" height="295" rx="16" fill="#542E10" />

    <!-- C. UNIFIED SOLID PAGE BLOCK (Single Solid Continuous Volume) -->
    <!-- The paper text block is recessed by 4px inside the cover:               -->
    <!-- Top-Right edge: (361, 89) to (377, 105)                                 -->
    <!-- Bottom-Right corner: (361, 376) to (377, 392)                           -->
    <!-- Bottom-Left edge: (146, 376) to (162, 392)                              -->
    
    <!-- 1. Right Side Fore-Edge Page Block (Clean single facet, shared vertices)-->
    <polygon points="361,89  377,105  377,392  361,376" fill="url(#solidPageRight)" />
    <!-- Fine page grain lines (continuous, parallel, harmonious) -->
    <line x1="365" y1="95"  x2="365" y2="380" stroke="#D3C5AB" stroke-width="1" opacity="0.75" />
    <line x1="369" y1="99"  x2="369" y2="384" stroke="#D3C5AB" stroke-width="1" opacity="0.75" />
    <line x1="373" y1="103" x2="373" y2="388" stroke="#D3C5AB" stroke-width="1" opacity="0.75" />

    <!-- 2. Bottom Side Page Block (Clean single facet, meeting at (361, 376) & (377, 392)) -->
    <polygon points="146,376  361,376  377,392  162,392" fill="url(#solidPageBottom)" />
    <!-- Fine page grain lines on bottom -->
    <line x1="152" y1="382" x2="367" y2="382" stroke="#A8987B" stroke-width="1" opacity="0.65" />
    <line x1="156" y1="387" x2="371" y2="387" stroke="#A8987B" stroke-width="1" opacity="0.65" />

    <!-- Page Corner Bevel Seam (Meeting at the bottom-right corner of the pages) -->
    <line x1="361" y1="376" x2="377" y2="392" stroke="#9C8B6E" stroke-width="1.2" opacity="0.8" />

    <!-- D. FRONT COVER (Solid Light Brown Hardcover, Inset Overhang) -->
    <rect x="130" y="85" width="235" height="295" rx="16" fill="url(#coverGrad)" stroke="#874E1F" stroke-width="2.5" />

    <!-- Spine Binding (Rounded Left Tube seamlessly joining Front & Back) -->
    <path d="M 130 85 
             C 114 85, 114 99, 114 103 
             L 114 365 
             C 114 369, 114 380, 130 380 
             L 146 396 
             L 146 101 
             Z" 
          fill="url(#spineGrad)" 
          stroke="#603410" 
          stroke-width="1.8" />

    <!-- Spine Vertical Highlight Reflection Bead -->
    <line x1="122" y1="98" x2="122" y2="372" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Debossed Border Stitching on Cover -->
    <rect x="144" y="99" width="207" height="267" rx="11" fill="none" stroke="#754117" stroke-width="1.8" stroke-dasharray="5,4" opacity="0.85" />

    <!-- Top-Right Gold Corner Accent (Cleanly integrated on cover) -->
    <path d="M 345 87 L 363 87 L 363 105 L 357 105 L 357 93 L 345 93 Z" fill="#E6C480" stroke="#A68036" stroke-width="0.8" />

    <!-- ================================================================= -->
    <!-- E. THE WRAPPING ORANGE BOOKMARK RIBBON                            -->
    <!--    Seamlessly exits behind bottom-right, wraps around corner,     -->
    <!--    and curves across front from right to left                     -->
    <!-- ================================================================= -->

    <!-- 1. Bottom-Right Corner Wrap (Hugs the unified book edge) -->
    <polygon points="365,326  377,338  377,368  365,358" fill="url(#ribbonUnderside)" />
    <line x1="365" y1="326" x2="365" y2="358" stroke="#732600" stroke-width="1.5" />

    <!-- 2. Main Ribbon Banner flowing across the front cover -->
    <!-- Right edge (365, 326-358) -> sweeps across to spine on left (114, 280) -->
    <g filter="url(#ribbonShadow)">
      
      <!-- Flowing satin ribbon body -->
      <path d="M 365 358 
               C 310 338, 250 322, 195 308 
               C 160 300, 134 294, 114 286 
               L 114 250 
               C 136 258, 166 264, 202 272 
               C 256 286, 314 304, 365 326 Z" 
            fill="url(#ribbonFront)" 
            stroke="#BD4800" 
            stroke-width="1.5" />

      <!-- Left spine wrap fold -->
      <path d="M 114 286 L 114 250 L 102 262 L 102 278 Z" fill="url(#ribbonUnderside)" stroke="#8A3400" stroke-width="1" />

      <!-- Satin Specular Highlight Line -->
      <path d="M 359 328 
               C 308 310, 252 292, 198 278 
               C 164 270, 136 264, 118 256" 
            fill="none" 
            stroke="rgba(255,255,255,0.48)" 
            stroke-width="2.5" 
            stroke-linecap="round" />
    </g>

    
    <!-- Clean Minimalist Ribbon without text for Taskbar / Small Sizes -->
    

  </g>
</svg>
