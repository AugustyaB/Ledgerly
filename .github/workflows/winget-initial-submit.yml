name: Submit Initial WinGet Package

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  submit-initial-winget:
    name: Submit Initial Manifest to WinGet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Submit Manifests to microsoft/winget-pkgs via GitHub API
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: node scripts/submit-winget-pr.js
