name: Multi-Platform Release Packaging (Desktop & Mobile)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows Desktop Installer (.exe NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm install
      - run: npm run check
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Ledgerly-Windows-NSIS-Installer
          path: dist/*.exe
          retention-days: 30
      - name: Attach Windows Installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.9.0' }}
          files: dist/*.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: macOS Desktop (.dmg & .zip)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build macOS Desktop (.dmg & .zip)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Ledgerly-macOS-Desktop
          path: |
            dist/*.dmg
            dist/*-mac.zip
          retention-days: 30
      - name: Attach macOS Artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.9.0' }}
          files: |
            dist/*.dmg
            dist/*-mac.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Linux Desktop (.AppImage & .deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build Linux Desktop (.AppImage & .deb)
        run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: Ledgerly-Linux-Desktop
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 30
      - name: Attach Linux Artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.9.0' }}
          files: |
            dist/*.AppImage
            dist/*.deb
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Android Companion APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Build Android Companion APK
        run: |
          npm run mobile:build
          npm -w mobile exec -- cap sync android
          cd mobile/android && chmod +x gradlew && ./gradlew assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dist/Ledgerly-Android-Companion.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Ledgerly-Android-APK
          path: dist/Ledgerly-Android-Companion.apk
          retention-days: 30
      - name: Attach Android APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.9.0' }}
          files: dist/Ledgerly-Android-Companion.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: iOS Companion (.xcarchive)
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: |
          npm install
          ln -sfn "$GITHUB_WORKSPACE/node_modules" "$GITHUB_WORKSPACE/mobile/node_modules"
      - name: Build & Archive iOS Companion (.xcarchive)
        run: |
          npm run mobile:build
          cd mobile && npx cap sync ios
          cd ios/App && pod install
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/App.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""
          cd build && tar -czf Ledgerly-iOS-App.xcarchive.tar.gz App.xcarchive
      - uses: actions/upload-artifact@v4
        with:
          name: Ledgerly-iOS-xcarchive
          path: mobile/ios/App/build/Ledgerly-iOS-App.xcarchive.tar.gz
          retention-days: 30
      - name: Attach iOS Artifact to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.9.0' }}
          files: mobile/ios/App/build/Ledgerly-iOS-App.xcarchive.tar.gz
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
