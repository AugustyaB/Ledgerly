name: Multi-Platform Release Packaging (Desktop & Mobile)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows Desktop Installer (.exe NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm install
      - run: npm run check
      - run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Ledgerly-Windows-NSIS-Installer
          path: dist/*.exe
          retention-days: 30
      - name: Attach Windows Installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          files: dist/*.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: macOS Desktop (.dmg & .zip)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build macOS Desktop (.dmg & .zip)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Ledgerly-macOS-Desktop
          path: |
            dist/*.dmg
            dist/*-mac.zip
          retention-days: 30
      - name: Attach macOS Artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          files: |
            dist/*.dmg
            dist/*-mac.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Linux Desktop (.AppImage & .deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build Linux Desktop (.AppImage & .deb)
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Installation & Launch (.deb & .AppImage)
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          echo "=== Testing .deb installation ==="
          sudo dpkg -i dist/*.deb || sudo apt-get install -f -y
          echo "=== Launching installed Ledgerly via xvfb ==="
          BIN_PATH=$(which ledgerly 2>/dev/null || find /opt -name "*ledgerly*" -type f -perm /111 2>/dev/null | head -n 1)
          echo "Resolved binary path: $BIN_PATH"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" "$BIN_PATH" --no-sandbox &
          sleep 5
          if pgrep -f "ledgerly" > /dev/null; then
            echo "✅ Ledgerly .deb installed and running!"
            pkill -f "ledgerly" || true
          else
            echo "❌ Ledgerly .deb failed to launch"
            exit 1
          fi
          echo "=== Testing .AppImage launch ==="
          chmod +x dist/*.AppImage
          cd dist && ./Ledgerly-*.AppImage --appimage-extract > /dev/null
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" ./squashfs-root/ledgerly --no-sandbox &
          sleep 5
          if pgrep -f "ledgerly" > /dev/null; then
            echo "✅ Ledgerly .AppImage extracted and running!"
            pkill -f "ledgerly" || true
          else
            echo "❌ Ledgerly .AppImage failed to launch"
            exit 1
          fi
          cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: Ledgerly-Linux-Desktop
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 30
      - name: Attach Linux Artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          files: |
            dist/*.AppImage
            dist/*.deb
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Android Companion APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Build Android Companion APK
        run: |
          npm run mobile:build
          npm -w mobile exec -- cap sync android
          cd mobile/android && chmod +x gradlew && ./gradlew assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dist/Ledgerly-Android-Companion.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Ledgerly-Android-APK
          path: dist/Ledgerly-Android-Companion.apk
          retention-days: 30
      - name: Attach Android APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          files: dist/Ledgerly-Android-Companion.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: iOS Companion (.xcarchive)
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: |
          npm install
          ln -sfn "$GITHUB_WORKSPACE/node_modules" "$GITHUB_WORKSPACE/mobile/node_modules"
      - name: Build & Archive iOS Companion (.xcarchive)
        run: |
          npm run mobile:build
          cd mobile && npx cap sync ios
          cd ios/App && pod install
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/App.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""
          cd build && tar -czf Ledgerly-iOS-App.xcarchive.tar.gz App.xcarchive
      - uses: actions/upload-artifact@v4
        with:
          name: Ledgerly-iOS-xcarchive
          path: mobile/ios/App/build/Ledgerly-iOS-App.xcarchive.tar.gz
          retention-days: 30
      - name: Attach iOS Artifact to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          files: mobile/ios/App/build/Ledgerly-iOS-App.xcarchive.tar.gz
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Simulator Installation & Launch (Headless iOS Simulator)
        run: |
          echo "=== Building App for iPhone 15 Simulator ==="
          cd mobile/ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -sdk iphonesimulator \
                     -destination 'platform=iOS Simulator,name=iPhone 15' \
                     -derivedDataPath build_sim \
                     build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO
          SIM_APP_PATH=$(find build_sim -name "App.app" -type d | head -n 1)
          echo "Found simulator bundle at: $SIM_APP_PATH"
          echo "=== Booting iPhone 15 Simulator ==="
          xcrun simctl boot "iPhone 15" || true
          echo "=== Installing App onto Simulator ==="
          xcrun simctl install "iPhone 15" "$SIM_APP_PATH"
          echo "=== Launching App on Simulator ==="
          xcrun simctl launch "iPhone 15" com.ledgerly.mobile
          sleep 5
          echo "=== Capturing Verification Screenshot ==="
          mkdir -p "$GITHUB_WORKSPACE/dist"
          xcrun simctl io "iPhone 15" screenshot "$GITHUB_WORKSPACE/dist/ios_simulator_launch.png"
          echo "✅ iOS Companion installed and launched on simulator!"

      - uses: actions/upload-artifact@v4
        with:
          name: Ledgerly-iOS-Simulator-Launch-Screenshot
          path: dist/ios_simulator_launch.png
          retention-days: 14

